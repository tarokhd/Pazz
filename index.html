<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
    <title>ثبت سفارشات لابراتوار پاز</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800;900&family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f1f5f9;
            --form-bg: rgba(255, 255, 255, 0.88);
            --text-color: #0f172a;
            --light-text: #475569;
            --border-color: #e2e8f0;
            --card-border: #e2e8f0;
            --card-bg: rgba(248, 250, 252, 0.8);
            --accent-color: #2563eb;
            --input-bg: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --glow-1: rgba(37, 99, 235, 0.12);
            --glow-2: rgba(124, 58, 237, 0.12);
            --glow-3: rgba(236, 72, 153, 0.1);
            --grid-color: rgba(37, 99, 235, 0.03);
        }

        body.dark-mode {
            --bg-color: #080c14;
            --form-bg: rgba(17, 24, 39, 0.85);
            --text-color: #f8fafc;
            --light-text: #cbd5e1;
            --border-color: #1f2937;
            --card-border: #1f2937;
            --card-bg: rgba(23, 32, 51, 0.8);
            --accent-color: #3b82f6;
            --input-bg: #1f2937;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --glow-1: rgba(59, 130, 246, 0.2);
            --glow-2: rgba(168, 85, 247, 0.18);
            --glow-3: rgba(236, 72, 153, 0.15);
            --grid-color: rgba(255, 255, 255, 0.02);
        }
        
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 30px 20px;
            min-height: 95vh;
            margin: 0;
            gap: 25px;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shape-1 {
            position: fixed;
            top: -120px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--glow-1) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(20px);
        }

        .bg-shape-2 {
            position: fixed;
            bottom: -150px;
            left: -120px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, var(--glow-2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(20px);
        }

        .bg-shape-3 {
            position: fixed;
            top: 40%;
            left: 30%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--glow-3) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            filter: blur(30px);
        }

        .bg-art-circle {
            position: fixed;
            top: 10%;
            left: 5%;
            width: 250px;
            height: 250px;
            border: 1px dashed var(--accent-color);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: spin 60s linear infinite;
        }

        .bg-art-cross {
            position: fixed;
            bottom: 15%;
            right: 6%;
            width: 180px;
            height: 180px;
            border: 1px solid var(--accent-color);
            opacity: 0.08;
            transform: rotate(45deg);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .form-area, .order-list-area {
            background-color: var(--form-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 28px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s, box-shadow 0.3s, border-color 0.3s;
            box-sizing: border-box; 
            z-index: 1;
            border: 1px solid var(--border-color);
        }

        .form-area {
            width: 400px;
            text-align: center;
            height: fit-content;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            gap: 15px;
        }

        .camera-icon-wrapper {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-in-out;
        }

        .camera-icon-wrapper svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 2px 8px rgba(37, 99, 235, 0.4));
        }

        .shutter-animation {
            transform: scale(1.2) rotate(12deg);
        }

        .logo-text {
            font-family: 'Syne', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 0.9;
            text-transform: uppercase;
        }

        .logo-text .line1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-color) 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text .line2 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-color);
            opacity: 0.9;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--light-text);
            font-size: 0.9em;
        }

        input[type="text"], input[type="number"], textarea {
            font-family: inherit;
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            resize: vertical;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
            outline: none;
        }

        input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            min-height: 70px;
        }

        button {
            font-family: inherit;
            font-weight: 700;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px; 
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }
        
        .checkbox-group {
            border: 1px solid var(--border-color);
            background-color: var(--card-bg); 
            padding: 10px;
            border-radius: 8px;
            margin-top: 5px;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end; 
            gap: 6px;
        }

        .checkbox-group label { 
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 500;
            color: var(--text-color);
            margin: 0;
            padding: 5px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s;
            background-color: var(--input-bg);
        }

        .checkbox-group input[type="checkbox"] {
            display: none;
        }

        .checkbox-group input[type="checkbox"]:checked + label {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        #confirmationMessage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(8, 12, 20, 0.94);
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.15s ease-in;
            font-family: inherit;
        }

        #confirmationMessage.show {
            display: flex;
            opacity: 1;
        }

        #confirmationMessage strong {
            font-size: 4.5em;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 800;
            color: #60a5fa;
        }

        #confirmationMessage span {
             font-size: 1.3em;
             color: #cbd5e1;
        }

        .order-list-area {
            width: 550px;
            overflow-y: auto;
            height: 88vh;
            display: flex;
            flex-direction: column;
        }

        .order-list-area h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 20px;
            transition: color 0.3s, border-bottom-color 0.3s;
        }
        
        #orderList {
            flex-grow: 1;
        }

        .order-item {
            display: flex;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: var(--card-bg);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .item-number {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--accent-color);
            padding: 0 12px;
            border-left: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            transition: border-left-color 0.3s;
        }

        .item-details {
            flex-grow: 1;
            padding-right: 12px;
            text-align: right;
            font-size: 0.9em;
        }

        .item-details strong {
            display: block;
            color: var(--text-color);
            margin-bottom: 4px;
            font-weight: 700;
            transition: color 0.3s;
        }

        .item-details span {
            display: block;
            color: var(--light-text);
            font-size: 0.88em;
            transition: color 0.3s;
        }

        #exportButton {
            background-color: #10b981;
            margin-bottom: 15px;
            margin-top: 0;
        }

        #exportButton:hover {
            background-color: #059669;
        }

        .mode-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .mode-toggle label {
            cursor: pointer;
            font-size: 1.4em;
            color: var(--light-text);
            display: block;
            user-select: none;
        }

        .mode-toggle input {
            display: none;
        }
    </style>
</head>
<body id="appBody">
    <div class="bg-grid"></div>
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>
    <div class="bg-shape-3"></div>
    <div class="bg-art-circle"></div>
    <div class="bg-art-cross"></div>

    <div class="mode-toggle">
        <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
        <label for="darkModeToggle" id="toggleIcon">☀️</label>
    </div>

    <div class="form-area">
        <div class="header">
            <div id="cameraIcon" class="camera-icon-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
            </div>
            <div class="logo-text">
                <span class="line1">PAZZ</span>
                <span class="line2">ProLab</span>
            </div>
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label for="lastName">نام و نام خانوادگی</label>
                <input type="text" id="lastName" name="lastName" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="phoneNumber">شماره تماس</label>
                <input type="text" id="phoneNumber" name="phoneNumber" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="photoCount">تعداد قطعه عکس</label>
                <input type="number" id="photoCount" name="photoCount" min="1" value="6">
            </div>

            <div class="form-group">
                <label>جزئیات مشتری</label>
                <div class="checkbox-group" id="detailGenderAge">
                    <input type="checkbox" id="male" name="genderAge" value="آقا"><label for="male">آقا</label>
                    <input type="checkbox" id="female" name="genderAge" value="خانم"><label for="female">خانم</label>
                    <input type="checkbox" id="child" name="genderAge" value="کودک"><label for="child">کودک</label>
                    <input type="checkbox" id="teen" name="genderAge" value="نوجوان"><label for="teen">نوجوان</label>
                    <input type="checkbox" id="young" name="genderAge" value="جوان"><label for="young">جوان</label>
                    <input type="checkbox" id="middle" name="genderAge" value="میانسال"><label for="middle">میانسال</label>
                </div>
            </div>

            <div class="form-group">
                <label>رنگ‌ها</label>
                <div class="checkbox-group color-group" id="detailColors">
                    <input type="checkbox" id="color-green" name="color" value="سبز"><label for="color-green">سبز</label>
                    <input type="checkbox" id="color-red" name="color" value="قرمز"><label for="color-red">قرمز</label>
                    <input type="checkbox" id="color-blue" name="color" value="آبی"><label for="color-blue">آبی</label>
                    <input type="checkbox" id="color-black" name="color" value="مشکی"><label for="color-black">مشکی</label>
                    <input type="checkbox" id="color-white" name="color" value="سفید"><label for="color-white">سفید</label>
                    <input type="checkbox" id="color-pink" name="color" value="صورتی"><label for="color-pink">صورتی</label>
                    <input type="checkbox" id="color-purple" name="color" value="بنفش"><label for="color-purple">بنفش</label>
                    <input type="checkbox" id="color-yellow" name="color" value="زرد"><label for="color-yellow">زرد</label>
                    <input type="checkbox" id="color-orange" name="color" value="نارنجی"><label for="color-orange">نارنجی</label>
                    <input type="checkbox" id="color-brown" name="color" value="قهوه‌ای"><label for="color-brown">قهوه‌ای</label>
                </div>
            </div>
            
             <div class="form-group">
                <label for="description">توضیحات</label>
                <textarea id="description" name="description"></textarea>
            </div>

            <button type="submit" id="submitButton">ثبت سفارش</button>
        </form>
    </div>

    <div class="order-list-area">
        <h2>سفارشات ثبت شده لابراتوار پاز</h2>
        <button id="exportButton" onclick="exportOrdersToCSV()">گرفتن خروجی 📊</button>
        <div id="orderList">
            <p style="text-align: center; color: var(--light-text);">هنوز سفارشی ثبت نشده است.</p>
        </div>
    </div>
    
    <div id="confirmationMessage">
        <span style="color: #aaa;">کد ردیابی جهت درج روی پاکت:</span>
        <strong id="displayOrderID"></strong>
        <span id="displayName"></span>
    </div>

    <audio id="shutterSound" src="./shutter.mp3" preload="auto"></audio> 

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxuXkBvHiGQtol7r6sUsyevrnwVsi3u4kfkuJg-OyuQSiltCODmYGGoVSTJiWt_UA3f/exec';

        const form = document.getElementById('orderForm');
        const cameraIcon = document.getElementById('cameraIcon');
        const shutterSound = document.getElementById('shutterSound');
        const lastNameInput = document.getElementById('lastName');
        const orderList = document.getElementById('orderList');
        const confirmationMessage = document.getElementById('confirmationMessage');
        const displayOrderID = document.getElementById('displayOrderID');
        const displayName = document.getElementById('displayName');
        const appBody = document.getElementById('appBody');
        const toggleIcon = document.getElementById('toggleIcon');
        const exportButton = document.getElementById('exportButton');

        let sessionOrders = [];
        let confirmationTimeout;

        function generateOrderID() {
            const now = new Date();
            const year = String(now.getFullYear()).slice(2);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const uniquePart = String(now.getTime()).slice(-6); 
            return `${year}${month}${day}-${uniquePart}`;
        }

        function renderOrders() {
            orderList.innerHTML = ''; 

            if (sessionOrders.length === 0) {
                orderList.innerHTML = '<p style="text-align: center; color: var(--light-text);">هنوز سفارشی ثبت نشده است.</p>';
                exportButton.style.display = 'none';
                return;
            }
            
            exportButton.style.display = 'block';

            [...sessionOrders].reverse().forEach((order, index) => { 
                const item = document.createElement('div');
                item.className = 'order-item';
                
                const itemNumber = sessionOrders.length - index; 

                const descriptionDisplay = order.description && order.description.length > 0 
                    ? ` | توضیحات: ${order.description.substring(0, 20)}${order.description.length > 20 ? '...' : ''}`
                    : '';
                
                const phoneDisplay = order.phoneNumber && order.phoneNumber !== '---'
                    ? ` | تماس: ${order.phoneNumber}`
                    : '';
                
                const genderAgeStr = order.details.genderAge.length > 0 ? order.details.genderAge.join(', ') : '';
                const colorsStr = order.details.colors.length > 0 ? order.details.colors.join(', ') : '';
                
                let detailsSummary = '';
                if (genderAgeStr) {
                    detailsSummary += `مشتری: [${genderAgeStr}]`;
                }
                if (colorsStr) {
                    detailsSummary += detailsSummary ? ` - رنگ: [${colorsStr}]` : `رنگ: [${colorsStr}]`;
                }
                const detailsDisplay = detailsSummary ? ` | ${detailsSummary}` : '';

                item.innerHTML = `
                    <div class="item-number">#${itemNumber}</div>
                    <div class="item-details">
                        <strong>کد ردیابی: ${order.id}</strong>
                        <span>فامیل: ${order.lastName} | تعداد: ${order.photoCount} قطعه ${phoneDisplay}</span>
                        <span style="font-size: 0.8em; opacity: 0.8;">زمان ثبت: ${order.time} ${detailsDisplay} ${descriptionDisplay}</span>
                    </div>
                `;
                orderList.appendChild(item);
            });
        }
        
        function showConfirmation(id, name) {
            displayOrderID.textContent = id;
            displayName.textContent = `فامیل ثبت شده: ${name}`;
            confirmationMessage.classList.add('show');

            clearTimeout(confirmationTimeout);
            confirmationTimeout = setTimeout(() => {
                confirmationMessage.classList.remove('show');
            }, 1500); 
        }

        function exportOrdersToCSV() {
            if (sessionOrders.length === 0) {
                alert("لیست سفارشات خالی است.");
                return;
            }

            let csvContent = "کد ردیابی,نام خانوادگی,شماره تماس,تعداد قطعه عکس,جزئیات مشتری (جنسیت/سن),رنگ‌های انتخابی,توضیحات,زمان و تاریخ ثبت,وضعیت\n";

            sessionOrders.forEach(order => {
                const sanitize = (str) => {
                    return `"${String(str).replace(/"/g, '""').replace(/\n/g, ' ')}"`;
                };

                const genderAgeStr = order.details.genderAge.join(' ');
                const colorsStr = order.details.colors.join(', ');

                const row = [
                    sanitize(order.id),
                    sanitize(order.lastName),
                    sanitize(order.phoneNumber),
                    sanitize(order.photoCount),
                    sanitize(genderAgeStr),
                    sanitize(colorsStr),
                    sanitize(order.description),
                    sanitize(order.timestamp),
                    sanitize(order.status)
                ];
                csvContent += row.join(',') + "\n";
            });

            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            const now = new Date();
            const dateStr = now.toLocaleDateString('fa-IR').replace(/\//g, '-');
            link.setAttribute('href', url);
            link.setAttribute('download', `Pause-Orders-${dateStr}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            alert("فایل اکسل (CSV) با موفقیت دانلود شد.");
        }

        function toggleDarkMode() {
            const isDarkMode = appBody.classList.toggle('dark-mode');
            toggleIcon.textContent = isDarkMode ? '🌙' : '☀️';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault(); 

            const orderID = generateOrderID();

            const getCheckedValues = (name) => {
                return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`))
                            .map(input => input.value);
            };

            const selectedGenderAge = getCheckedValues('genderAge');
            const selectedColors = getCheckedValues('color');

            const now = new Date();
            const lastName = lastNameInput.value.trim() || 'نامشخص'; 
            const photoCountValue = document.getElementById('photoCount').value || 6;
            const descriptionValue = document.getElementById('description').value.trim(); 

            const orderData = {
                id: orderID,
                lastName: lastName,
                phoneNumber: document.getElementById('phoneNumber').value.trim() || '---',
                photoCount: photoCountValue,
                description: descriptionValue, 
                details: {
                    genderAge: selectedGenderAge,
                    colors: selectedColors
                },
                status: 'آماده چاپ',
                time: now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', hour12: false }),
                timestamp: now.toLocaleString('fa-IR'),
            };

            sessionOrders.push(orderData);
            renderOrders(); 

            const formData = new URLSearchParams();
            formData.append('id', orderData.id);
            formData.append('name', orderData.lastName);
            formData.append('phone', orderData.phoneNumber);
            formData.append('count', orderData.photoCount);
            formData.append('details', selectedGenderAge.join(', '));
            formData.append('colors', selectedColors.join(', '));
            formData.append('notes', orderData.description);
            formData.append('date', orderData.timestamp);

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            }).catch(error => console.error('خطا در ارسال به گوگل شیت:', error));

            try {
                if (shutterSound) { 
                    shutterSound.currentTime = 0;
                    shutterSound.play().catch(err => console.log('مشکل در پخش صدا:', err));
                }
            } catch (error) {
                console.warn("فایل صوتی یافت نشد یا مرورگر اجازه پخش نداد.");
            }
            
            cameraIcon.classList.add('shutter-animation');
            showConfirmation(orderID, lastName);

            setTimeout(() => {
                cameraIcon.classList.remove('shutter-animation');
                form.reset();
                document.getElementById('photoCount').value = 6; 
                
                document.querySelectorAll('input[name="genderAge"]').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[name="color"]').forEach(cb => cb.checked = false);

                lastNameInput.focus();
            }, 200); 
        });

        window.onload = function() {
            lastNameInput.focus();
            renderOrders();
        };
    </script>
</body>
</html>
